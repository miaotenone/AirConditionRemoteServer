# DEVELOPMENT ONLY: loopback broker; no ESP32 LAN access or authentication.
# Standalone foreground use: mosquitto -c deploy/mosquitto-ac.conf -v
# Do not install this beside another 1883 listener. See docs/deployment.md.
# Do not duplicate persistence settings from /etc/mosquitto/mosquitto.conf.
listener 1883 127.0.0.1
allow_anonymous true
