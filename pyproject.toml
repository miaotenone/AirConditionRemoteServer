[project]
name = "ac-bot"
version = "0.1.0"
description = "Feishu card <-> ESP32 AC gateway MQTT bridge for the Raspberry Pi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "lark-oapi==1.7.4",
    "pycryptodome==3.24.1",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.14.2"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# Pin the pair that is verified in production. uv's default resolution drifts both
# (lark-oapi 1.7.4 -> 1.7.5, pycryptodome 3.24.1 -> 4.0.0); rebuilding the venv
# must not silently change what runs on the Pi. uv.lock is the source of truth.
constraint-dependencies = ["lark-oapi==1.7.4", "pycryptodome==3.24.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
